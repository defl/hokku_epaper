name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-firmware-huessen_epf1301:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B firmware/huessen_epf1301/test/host/build firmware/huessen_epf1301/test/host

      - name: Build
        run: cmake --build firmware/huessen_epf1301/test/host/build

      - name: Run tests
        run: ctest --test-dir firmware/huessen_epf1301/test/host/build --output-on-failure

  test-firmware-bigme_f7:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B firmware/bigme_f7/test/host/build firmware/bigme_f7/test/host

      - name: Build
        run: cmake --build firmware/bigme_f7/test/host/build

      - name: Run tests
        run: ctest --test-dir firmware/bigme_f7/test/host/build --output-on-failure

  test-webserver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e "python/[test]"

      - name: Run tests
        run: pytest -m "not time_intensive"

  lint-firmware-huessen_epf1301:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: >
          cppcheck
          --enable=all
          --std=c11
          --suppress=missingIncludeSystem
          --suppress=missingInclude
          --suppress=checkersReport
          --suppress=unmatchedSuppression
          --inline-suppr
          --error-exitcode=1
          firmware/huessen_epf1301/main/

  lint-firmware-bigme_f7:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: sudo apt-get install -y --no-install-recommends cppcheck

      # unusedFunction is suppressed here (not on huessen_epf1301's lint job):
      # this is only a handful of C files, no headers from the SDK that calls
      # into them (command dispatch table, weak-symbol overrides), so cppcheck
      # can't see those call sites and flags every SDK entry point as dead code.
      # test/ is excluded (-i): scanning it together with main.c makes cppcheck
      # cross-contaminate its analysis — it picks up the host-test mocks' fixed
      # return values (e.g. OS_MutexLock always returning OS_OK) and wrongly
      # applies that to reasoning about main.c's real, variable-behavior
      # conditionals ("always false"), which is only true under the mock.
      - name: Run cppcheck
        run: >
          cppcheck
          --enable=all
          --std=c11
          --suppress=missingIncludeSystem
          --suppress=missingInclude
          --suppress=checkersReport
          --suppress=unmatchedSuppression
          --suppress=unusedFunction
          --inline-suppr
          --error-exitcode=1
          -ifirmware/bigme_f7/test
          firmware/bigme_f7/

  build-firmware-huessen_epf1301:
    needs: [test-firmware-huessen_epf1301, lint-firmware-huessen_epf1301]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32s3
          path: firmware/huessen_epf1301
          command: bash ci-build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: hokku-huessen_epf1301-firmware
          path: firmware/release/hokku-huessen_epf1301-*.bin

  build-firmware-bigme_f7:
    needs: [test-firmware-bigme_f7, lint-firmware-bigme_f7]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Third-party XR872 SDK the F7 firmware builds against — not part of this
      # repo. Pinned so the sdk_patches/*.patch below (which assumes this exact
      # content) keeps applying cleanly regardless of upstream changes.
      - name: Checkout XR872 SDK
        uses: actions/checkout@v5
        with:
          repository: divadiow/xr872_sdk
          ref: 73ca68a513316fd0dee6a5f5c68870b3c52049d1
          path: xr872_sdk

      - name: Apply SDK patches
        working-directory: xr872_sdk
        run: git apply "${{ github.workspace }}"/firmware/bigme_f7/sdk_patches/*.patch

      - name: Build toolchain image
        run: docker build -t hokku-bigme_f7-builder firmware/bigme_f7

      - name: Build firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/hokku_epaper" \
            -v "${{ github.workspace }}/xr872_sdk:/xr872_sdk" \
            hokku-bigme_f7-builder bash -lc '
              cd /hokku_epaper/firmware/bigme_f7 &&
              XR872_SDK=/xr872_sdk CC_DIR=/usr/bin bash ci-build.sh
            '

      - uses: actions/upload-artifact@v7
        with:
          name: hokku-bigme_f7-firmware
          path: firmware/release/hokku-bigme_f7-*.img

  build-webserver-deb:
    needs: [test-webserver, build-firmware-huessen_epf1301, build-firmware-bigme_f7]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-setuptools pybuild-plugin-pyproject

      # The "Flash a screen" feature ships both merged firmwares inside the
      # .deb. debian/install picks up firmware/release/hokku-* wildcarded, so
      # place both build jobs' artifacts there before building.
      - name: Download ESP32 firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: hokku-huessen_epf1301-firmware
          path: python/firmware/release

      - name: Download Bigme F7 firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: hokku-bigme_f7-firmware
          path: python/firmware/release

      - name: Build .deb
        working-directory: python
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p build
          mv hokku-server_*.deb hokku-server_*.buildinfo hokku-server_*.changes build/

      - uses: actions/upload-artifact@v7
        with:
          name: hokku-server-deb
          path: build/hokku-server_*.deb

  test-installer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e "installer/"

      - name: Import check
        run: |
          python -c "import hokku.installer"
          python -c "from hokku.installer.validators import validate_ssid, validate_wifi_password, validate_mdns_hostname"
          python -c "from hokku.installer.flask_app import create_app"

  build-installer-deb:
    needs: [test-installer]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-setuptools pybuild-plugin-pyproject

      - name: Build .deb
        working-directory: installer
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p build
          mv hokku-installer_*.deb hokku-installer_*.buildinfo hokku-installer_*.changes build/

      - uses: actions/upload-artifact@v7
        with:
          name: hokku-installer-deb
          path: build/hokku-installer_*.deb
