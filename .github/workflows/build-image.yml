name: Build Appliance Image

# Runs on two triggers:
#   - workflow_dispatch: manual, for a fresh .img.xz to test with. Optionally
#     pin server_run_id/installer_run_id to build from specific ci.yml runs
#     instead of the latest successful one.
#   - release (published): automatic — attaches the built .img.xz to the
#     release as a downloadable asset, built from the .deb artifacts that
#     came from the SAME commit the release was tagged at (not just
#     "whatever ci.yml run happens to be newest", which can race or point at
#     unrelated later commits).
# Image builds take 20-60 minutes.
on:
  workflow_dispatch:
    inputs:
      server_run_id:
        description: "CI run ID to fetch hokku-server-deb from (leave blank for latest from this workflow's ci.yml run)"
        required: false
      installer_run_id:
        description: "CI run ID to fetch hokku-installer-deb from (leave blank = same as above)"
        required: false
  release:
    types: [published]

jobs:
  build-image:
    runs-on: ubuntu-latest
    # Image builds are long; increase timeout beyond the default 6 hours if needed.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      # ── fetch the pre-built .deb packages ─────────────────────────────────
      # Resolution order per package:
      #   1. explicit *_run_id input (manual dispatch override)
      #   2. release event: the ci.yml run for the release's own commit —
      #      never "latest", which could be a later, unrelated commit
      #   3. otherwise: latest successful ci.yml run
      # installer_run_id defaults to whatever server_run_id resolved to
      # (documented in the input description as "leave blank = same as above").

      - name: Resolve CI run IDs for deb artifacts
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const inputs = context.payload.inputs || {};
            const isRelease = context.eventName === 'release';
            const headSha = isRelease ? context.sha : null;

            async function resolveRunId(explicit) {
              if (explicit) {
                console.log(`Using explicit run id: ${explicit}`);
                return explicit;
              }
              const params = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                status: 'success',
                per_page: 5,
              };
              if (headSha) params.head_sha = headSha;
              const { data: runs } = await github.rest.actions.listWorkflowRuns(params);
              if (!runs.workflow_runs.length) {
                throw new Error(headSha
                  ? `No successful ci.yml run found for commit ${headSha}`
                  : 'No successful ci.yml runs found');
              }
              const runId = runs.workflow_runs[0].id;
              console.log(`Resolved ci.yml run id: ${runId}${headSha ? ` (commit ${headSha})` : ' (latest successful)'}`);
              return runId;
            }

            try {
              const serverRunId = await resolveRunId(inputs.server_run_id);
              const installerRunId = await resolveRunId(inputs.installer_run_id || serverRunId);
              core.setOutput('server_run_id', serverRunId);
              core.setOutput('installer_run_id', installerRunId);
            } catch (err) {
              core.setFailed(err.message);
            }

      - name: Download hokku-server-deb
        uses: actions/download-artifact@v7
        with:
          name: hokku-server-deb
          run-id: ${{ steps.find-run.outputs.server_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/

      - name: Download hokku-installer-deb
        uses: actions/download-artifact@v7
        with:
          name: hokku-installer-deb
          run-id: ${{ steps.find-run.outputs.installer_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/

      - name: Show downloaded .debs
        run: ls -lh build/*.deb

      # ── build the image ────────────────────────────────────────────────────

      - name: Install host dependencies
        # PIGEN_DOCKER=0 (native build, no Docker) — build-docker.sh's own
        # binfmt_misc registration doesn't reliably propagate into its own
        # nested --privileged container on GitHub-hosted runners: pi-gen's
        # arch-test keeps reporting arm64 unsupported (native AND emulated)
        # even after a seemingly-successful registration, and even with
        # docker/setup-qemu-action added on top. Building directly on the
        # runner's own (real, unnested) kernel sidesteps the whole problem.
        # Confirmed necessary by five separate failed CI runs iterating on
        # the Docker path before switching to this.
        #
        # Package list is pi-gen's own native dependency list — see
        # .pigen/depends after the clone in build-image.sh (not committed
        # here since .pigen is cloned fresh each run). qemu-user-static is
        # ALSO needed alongside qemu-user-binfmt: arch-test passed with just
        # qemu-user-binfmt, but debootstrap's actual foreign-arch bootstrap
        # then failed ("Unable to execute target architecture") — it
        # specifically looks for the -static-suffixed qemu-aarch64-static
        # binary to copy into the target rootfs, which qemu-user-binfmt
        # doesn't provide. Confirmed by an actual failed run without it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git python3-pip quilt parted coreutils \
            qemu-user-binfmt qemu-user-static \
            debootstrap zerofree zip dosfstools e2fsprogs libcap2-bin \
            libarchive-tools rsync xz-utils curl xxd file kmod bc gpg \
            pigz arch-test

      - name: Build appliance image
        # No DEB_SERVER/DEB_INSTALLER override needed — build-image.sh already
        # auto-globs build/hokku-{server,installer}_*.deb for the just-downloaded
        # files (there's exactly one of each at this point in the job).
        run: bash os/pi/build-image.sh
        env:
          PIGEN_DOCKER: "0"

      - name: Find built image
        id: find-image
        run: |
          img=$(ls build/*.img.xz | head -1)
          echo "path=$img" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$img")" >> "$GITHUB_OUTPUT"
          du -sh "$img"

      # ── upload as artifact, and attach to the release when release-triggered ──

      - uses: actions/upload-artifact@v7
        with:
          name: hokku-appliance-image
          path: build/*.img.xz
          retention-days: 14

      - name: Attach image to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.find-image.outputs.path }}" --clobber
