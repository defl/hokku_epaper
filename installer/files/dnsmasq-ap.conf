# dnsmasq configuration for the Hokku setup access point.
# Binds to the AP interface (ap0 or wlan0 in AP mode) only.
# DHCP range: 192.168.11.10-100, 1-hour lease.
# DNS: all queries redirected to 192.168.11.1 (captive portal).

interface=wlan0
bind-interfaces

# DHCP
dhcp-range=192.168.11.10,192.168.11.100,255.255.255.0,1h
dhcp-option=3,192.168.11.1   # default gateway = us
dhcp-option=6,192.168.11.1   # DNS server = us

# Captive portal: resolve ALL DNS queries to our IP so phones auto-open the
# setup page. The Flask app handles the captive detection probe URLs.
address=/#/192.168.11.1

# Don't use /etc/resolv.conf or /etc/hosts for upstream resolution.
no-resolv
no-hosts

# Logging
log-queries
log-dhcp
