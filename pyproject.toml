[tool.ruff]
line-length = 100
target-version = "py39"
src = ["webserver", "tools"]
exclude = [
    ".venv",
    "webserver/build",
    "webserver/.pybuild",
    "webserver/debian",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.per-file-ignores]
"webserver/tests/conftest.py" = ["E402"]  # sys.path setup must precede local imports

[tool.ruff.lint.isort]
known-first-party = ["hokku_server", "hokku_config", "hokku_setup"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = [
    "webserver/hokku_server",
    "webserver/tests",
    "tools",
]
exclude = [
    ".venv",
    "webserver/build",
    "webserver/.pybuild",
    "webserver/debian",
]
typeCheckingMode = "basic"
